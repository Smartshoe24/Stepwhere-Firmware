name: Set up STM32 Arduino toolchain
description: arduino-cli, STM32duino core 2.12.0 and the firmware's libraries (pinned)
runs:
  using: composite
  steps:
    - uses: arduino/setup-arduino-cli@v2
      with:
        version: "1.2.2"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.arduino15
          ~/Arduino/libraries
        key: stm32-2.12.0-libs-v1
    - shell: bash
      run: |
        URL=https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
        arduino-cli config init --overwrite --additional-urls "$URL"
        arduino-cli core update-index
        # 2.x is required: core 3.0.0 breaks HardwareSerial(rx, tx) (docs/DECISIONS.md D-06)
        arduino-cli core install STMicroelectronics:stm32@2.12.0
        arduino-cli lib install "TinyGPSPlus@1.0.3" "STM32duino Low Power@2.0.0" \
          "STM32duino RTC@2.0.0" "STM32_TimerInterrupt@1.3.0"
